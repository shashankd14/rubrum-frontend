name: Deploy React App

on:
  push:
    branches:
      - major-ui
      - jsw_one
      - prod_jsw

jobs:
  deploy-major-ui:
    if: github.ref == 'refs/heads/major-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - run: npm install && npm run build

      - name: Copy build to Dev EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ASPEN_HOST_PROD }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/*"
          target: "/usr/share/nginx/html"

      - name: Restart Nginx (Dev)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.ASPEN_HOST_PROD }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart nginx

  deploy-jsw_one:
    if: github.ref == 'refs/heads/jsw_one'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - run: npm install && npm run build

      - name: Copy build to UAT EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.JSW_HOST_UAT }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/*"
          target: "/usr/share/nginx/html/apps"

      - name: Restart Nginx (UAT)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.JSW_HOST_UAT }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart nginx

  deploy-prod_jsw:
    if: github.ref == 'refs/heads/prod_jsw'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - run: npm install && npm run build

      - name: Copy build to UAT EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.JSW_HOST_PROD }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/*"
          target: "/usr/share/nginx/html/apps"

      - name: Restart Nginx (UAT)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.JSW_HOST_UAT }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart nginx


    
